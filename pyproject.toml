[project]
name = "drive-tidy"
version = "0.1.0"
description = "Find clean-up candidates on a drive and send approved ones to the Recycle Bin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
drive-tidy = "drive_tidy.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
